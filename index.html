<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>BOSE</title>
    <link
      rel="shortcut icon"
      href="./src/images/favicon.png"
      type="image/x-icon"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header class="header" id="home">
      <nav class="navigation header__navigation">
        <a href="" class="logo navigation__logo">
          <img src="./src/images/logo.svg" alt="Logo" class="logo__icon">
        </a>

        <div class="navigation__actions">
          <a href="" class="phone navigation__phone">
            <img src="./src/images/phone-call.svg" alt="Phone call" class="phone__icon">
          </a>

          <div class="toggle navigation__toggle">
            <input type="checkbox" id="menu-toggle" class="toggle__input">
            <label for="menu-toggle" class="toggle__label">
              <span class="toggle__caption">Open menu</span>
            </label>

            <div class="menu">
              <nav class="navigation menu__navigation">
                <a href="" class="logo navigation__logo">
                  <img src="./src/images/logo.svg" alt="Logo" class="logo__icon">
                </a>

                <label for="menu-toggle" class="close navigation__close">
                  <img src="./src/images/close.svg" alt="Close menu" class="close__icon">
                </label>
              </nav>

              <nav class="links menu__links">
                <ul class="links__list">
                  <li class="links__item"><a href="" class="links__link">home</a></li>
                  <li class="links__item"><a href="" class="links__link">recommended</a></li>
                  <li class="links__item"><a href="" class="links__link">categories</a></li>
                  <li class="links__item"><a href="" class="links__link">How to buy</a></li>
                  <li class="links__item"><a href="" class="links__link">Contacts</a></li>
                </ul>
              </nav>

              <section class="order menu__order">
                <p class="order__paragraph">+1 234 5555-55-55</p>

                <a href="" class="order__call-link">call to order</a>
              </section>
            </div>
          </div>
        </div>
      </nav>

      <h1 class="header__title">
        The world shades.<br>
        Your music shines.
      </h1>
    </header>
  </body>
</html>
